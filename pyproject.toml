[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "soup-release-lab-maximushkabed"
version = "0.9.4"
description = "A small CLI for demonstrating release pipeline failures"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{name = "Maksim"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
soup-release = "soup_release_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soup_release_lab = ["greeting.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
