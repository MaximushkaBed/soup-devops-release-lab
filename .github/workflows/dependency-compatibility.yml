name: Dependency compatibility
run-name: "Dependencies / ${{ inputs.fault || 'fixed' }} / ${{ github.ref_name }}"
on:
  workflow_dispatch:
    inputs:
      fault:
        description: Real dependency incident, applied to a temporary fixture only
        type: choice
        default: fixed
        options: [fixed, removed-api, undeclared-runtime]
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.ref }}-${{ inputs.fault || github.event_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r requirements/ci.txt
      - name: Build the fixture once from its sdist
        env:
          FAULT: ${{ inputs.fault || 'fixed' }}
        run: python tools/dependency_lab.py build "$FAULT" dependency-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependencies-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Verify both real dependency incidents and their positive controls
        if: (inputs.fault || 'fixed') == 'fixed'
        run: python tools/dependency_lab.py experiment .evidence/dependency-comparisons
      - name: Preserve comparison logs, including unexpected failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-comparisons-${{ github.run_id }}-${{ github.run_attempt }}
          path: .evidence/dependency-comparisons/
          if-no-files-found: ignore
          retention-days: 30
  naive:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dependencies-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-bundle
      - run: python tools/dependency_lab.py test dependency-bundle --profile minimum --naive
  clean:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.10', '3.14']
        profile: [minimum, current]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dependencies-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-bundle
      - name: Resolve only declared dependencies, then run offline HTTP contracts
        run: python tools/dependency_lab.py test dependency-bundle --profile "${{ matrix.profile }}"
