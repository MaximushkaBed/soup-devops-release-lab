name: Release checks
run-name: "Release checks / ${{ inputs.fault || github.ref_name }}"
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      fault:
        description: Deliberate incident (dispatch only; never published)
        type: choice
        default: fixed
        options: [fixed, python310, windows, missing-data, entrypoint]
permissions:
  contents: read
# Do not cancel an in-flight publication. Each incident keeps its own evidence.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.fault || github.event_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Only release commits on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r requirements/ci.txt
      - name: Apply a demonstration fault only for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          FAULT: ${{ inputs.fault }}
        run: |
          python tools/inject_bug.py "$FAULT"
          git diff -- src pyproject.toml
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - name: Build once (wheel is built from sdist)
        run: python -m build --no-isolation --outdir bundle/dist
      - run: python -m twine check --strict bundle/dist/*
      - run: python tools/provenance.py record bundle
      - run: python tools/check_supply_chain.py bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30
  artifact-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle
      - id: verify
        run: python tools/provenance.py verify bundle
      - name: Wheel in clean runtime
        run: python tools/test_artifact.py "bundle/dist/*.whl"
      - name: Sdist rebuilt separately, then installed in clean runtime
        # Separate step: a failed wheel is still a red job, but we retain both observations.
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: python tools/test_artifact.py "bundle/dist/*.tar.gz"
  docker:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle
      - run: docker build --network=none -t soup-release:ci .
      - run: docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges soup-release:ci --name Soup --json
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'MaximushkaBed/soup-devops-release-lab'
    needs: [build, artifact-tests, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/soup-release-lab-maximushkabed
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle
      - run: python tools/provenance.py verify bundle
      - name: Publish the tested bytes through OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: bundle/dist/
          attestations: true
  verify-index:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle
      - run: python tools/verify_index.py bundle
