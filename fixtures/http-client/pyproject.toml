[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "soup-http-dependency-lab"
version = "0.1.0"
description = "An offline HTTP client fixture for real dependency compatibility experiments"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["httpx>=0.27.2,<0.29", "tenacity>=8.5,<10"]

[project.scripts]
soup-http-probe = "soup_http_probe:main"

[tool.setuptools.packages.find]
where = ["src"]
